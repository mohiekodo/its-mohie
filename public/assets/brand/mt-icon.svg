<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MT monogram icon">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="mtStroke" x1="56" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#f7ba2e"/>
    </linearGradient>
    <linearGradient id="tStroke" x1="176" y1="0" x2="216" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f7ba2e"/>
      <stop offset="100%" stop-color="#ff8c00"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="240" height="240" rx="48" fill="none" stroke="#374151" stroke-width="2"/>

  <!-- MT Monogram -->
  <!-- Stylized M: verticals with central peak, rounded joins -->
  <path d="M64 172 V84 L96 144 L128 84 V172" stroke="url(#mtStroke)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#softGlow)"/>

  <!-- Stylized T: top bar and stem integrated to the right -->
  <path d="M168 84 H208 M188 84 V172" stroke="url(#tStroke)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#softGlow)"/>

  <!-- Subtle accent dots to suggest connectivity -->
  <circle cx="128" cy="188" r="3" fill="#2dd4bf" opacity="0.8"/>
  <circle cx="188" cy="188" r="3" fill="#f7ba2e" opacity="0.85"/>
</svg>

