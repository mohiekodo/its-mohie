<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-label="MT monogram">
  <defs>

    <!-- Blur filters for layered glow -->
    <filter id="glow-lg" x="-110%" y="-110%" width="320%" height="320%">
      <feGaussianBlur stdDeviation="52"/>
    </filter>
    <filter id="glow-sm" x="-55%" y="-55%" width="210%" height="210%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <!--
      Aurora gradient spanning the full letter block width (x 103 → 381)
      so every stroke picks up the correct colour slice.
      Blue → Violet → Purple → Pink  (left to right)
    -->
    <linearGradient id="aurora"
        x1="103" y1="0" x2="381" y2="0"
        gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#4361EE"/>
      <stop offset="28%"  stop-color="#7B52F8"/>
      <stop offset="62%"  stop-color="#A03ED8"/>
      <stop offset="100%" stop-color="#FF6B9D"/>
    </linearGradient>

  </defs>

  <!-- ── Glow layers ───────────────────────────────────────────── -->
  <!-- Outer diffuse halo (blue-tinted) -->
  <circle cx="250" cy="250" r="236"
          fill="#B4C4FF" opacity="0.40"
          filter="url(#glow-lg)"/>
  <!-- Inner halo (lavender) -->
  <circle cx="250" cy="250" r="211"
          fill="#CEC8FF" opacity="0.55"
          filter="url(#glow-sm)"/>

  <!-- ── White circle ──────────────────────────────────────────── -->
  <circle cx="250" cy="250" r="194" fill="white"/>

  <!-- ── Letterforms ───────────────────────────────────────────── -->
  <!--
    Stroke width: 44px   Round caps & joins throughout.

    Coordinate logic
    ─────────────────
    Each arch of "m" is a semicircle of radius 53.
    • Arch centre-lines sit at y = 253.
    • Arch peak (centre-line) at y = 253 − 53 = 200.
    • Outer top of stroke:  y = 200 − 22 = 178.

    T crossbar centre-line at y = 157.
    • T crossbar outer bottom: y = 157 + 22 = 179.

    The outer top of the "m" arches (178) and the outer bottom of the
    T crossbar (179) differ by 1 px — they visually kiss, creating the
    interlocked monogram effect.

    The T's vertical (x = 359) shares / overlaps the right leg of arch-2
    (also x = 359), so both become one continuous stroke.

    Letter block extents after 44 px stroke:
      left  103  right  381  top  135  bottom  360
    Geometric centre ≈ (242, 247) — well centred in the 500-px canvas.
  -->

  <!-- m — first arch (left leg → arch over → middle) -->
  <path d="M 147 338  L 147 253  A 53 53 0 0 0 253 253  L 253 338"
        fill="none"
        stroke="url(#aurora)"
        stroke-width="44"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- m — second arch (middle → arch over → right leg) -->
  <path d="M 253 338  L 253 253  A 53 53 0 0 0 359 253  L 359 338"
        fill="none"
        stroke="url(#aurora)"
        stroke-width="44"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!--
    T — crossbar extends LEFT from the shared vertical,
    then the vertical continues down (coinciding with m's right leg).
    stroke-linejoin="round" gives a smooth elbow at (359, 157).
  -->
  <path d="M 245 157  L 359 157  L 359 338"
        fill="none"
        stroke="url(#aurora)"
        stroke-width="44"
        stroke-linecap="round"
        stroke-linejoin="round"/>

</svg>
