  <g fill="none" stroke="#8AB4F8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M230 170 H260 V242 H288"/>
    <path d="M230 314 H260 V242"/>
    <path d="M488 242 H518 V152 H548"/>
    <path d="M518 242 H548"/>
    <path d="M518 242 V332 H548"/>
