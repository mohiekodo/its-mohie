  <rect x="88" y="198" width="120" height="8" rx="4" fill="#8AB4F8"/>
  <rect x="88" y="212" width="88" height="6" rx="3" fill="#E3E8EF"/>

  <rect x="70" y="250" width="160" height="128" rx="16" fill="#F0F4F9"/>
  <rect x="88" y="268" width="36" height="36" rx="10" fill="#A062FF"/>
  <rect x="97" y="280" width="18" height="14" rx="3" fill="none" stroke="#fff" stroke-width="2"/>
