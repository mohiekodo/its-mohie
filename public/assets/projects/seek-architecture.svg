<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Recruitment platform backend architecture illustration">
  <defs>
    <linearGradient id="aurora" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1A73E8"/>
      <stop offset="0.3" stop-color="#8AB4F8"/>
      <stop offset="0.7" stop-color="#A062FF"/>
      <stop offset="1" stop-color="#FF8BCB"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="#F0F4F9"/>
  <circle cx="90" cy="60" r="150" fill="#8AB4F8" opacity="0.25"/>
  <circle cx="720" cy="400" r="170" fill="#FF8BCB" opacity="0.22"/>

