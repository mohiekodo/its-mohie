  <circle cx="118" cy="63" r="6" fill="#A062FF"/>
  <text x="154" y="68" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="14" font-weight="600" fill="#1F1F1F">Talent platform</text>
  <rect x="638" y="53" width="90" height="22" rx="11" fill="#E8F0FE"/>
  <text x="683" y="68" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1A73E8">Architecture</text>

  <!-- Candidate and consultant applications -->
  <rect x="70" y="106" width="160" height="128" rx="16" fill="#F0F4F9"/>
