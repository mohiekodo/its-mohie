  <rect x="548" y="296" width="182" height="72" rx="16" fill="#F0F4F9"/>
  <rect x="562" y="316" width="32" height="32" rx="9" fill="#FF8BCB"/>
  <path d="M569 333 H574 L578 324 L582 340 L586 333" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
