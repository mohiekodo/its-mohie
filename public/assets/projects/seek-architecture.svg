<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Use a unique gradient id to avoid any potential conflicts -->
    <linearGradient id="bg1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#24283b"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0" x2="1" y1="0" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#f7ba2e"/>
      <stop offset="100%" stop-color="#ff8c00"/>
    </linearGradient>
    <linearGradient id="teal1" x1="0" x2="1" y1="0" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg1)"/>

  <!-- Left panel -->
  <g transform="translate(60,80)">
    <rect x="0" y="0" rx="10" ry="10" width="340" height="200" fill="#101219" stroke="#374151" stroke-width="2"/>
    <rect x="20" y="20" rx="4" ry="4" width="140" height="16" fill="#374151"/>
    <rect x="20" y="58" rx="6" ry="6" width="300" height="10" fill="#2dd4bf"/>
    <rect x="20" y="78" rx="6" ry="6" width="260" height="10" fill="#2dd4bf" opacity="0.7"/>
    <rect x="20" y="98" rx="6" ry="6" width="280" height="10" fill="#2dd4bf" opacity="0.5"/>
  </g>

  <!-- Right panel with architecture nodes -->
  <g transform="translate(460,140)">
    <rect x="0" y="0" rx="10" ry="10" width="260" height="160" fill="#101219" stroke="#374151"/>
    <circle cx="60" cy="80" r="30" fill="none" stroke="url(#gold1)" stroke-width="6"/>
    <circle cx="130" cy="80" r="30" fill="none" stroke="url(#teal1)" stroke-width="6"/>
    <circle cx="200" cy="80" r="30" fill="none" stroke="#10b981" stroke-width="6"/>
  </g>

  <!-- Connection lines -->
  <g transform="translate(220,260)">
    <path d="M0,0 L120,0" stroke="#f7ba2e" stroke-width="3"/>
    <path d="M120,0 L200,-40" stroke="#2dd4bf" stroke-width="3"/>
    <path d="M120,0 L200,40" stroke="#10b981" stroke-width="3"/>
  </g>

  <!-- Caption aligned with other SVGs to avoid cropping under object-cover -->
  <text x="60" y="320" fill="#9ca3af" font-size="14" font-family="Inter, Arial, sans-serif">Scalable backend infrastructure · Node.js · TypeScript · AWS</text>
</svg>

