  <rect x="50" y="40" width="700" height="370" rx="22" fill="#fff" filter="url(#shadow)"/>
  <line x1="50" y1="86" x2="750" y2="86" stroke="#E3E8EF"/>
  <circle cx="78" cy="63" r="6" fill="#FF8BCB"/>
