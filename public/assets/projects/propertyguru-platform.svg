<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Property data platform dashboard illustration">
  <defs>
    <linearGradient id="aurora" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1A73E8"/>
      <stop offset="0.3" stop-color="#8AB4F8"/>
      <stop offset="0.7" stop-color="#A062FF"/>
      <stop offset="1" stop-color="#FF8BCB"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A062FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#A062FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="#F0F4F9"/>
  <circle cx="90" cy="60" r="150" fill="#8AB4F8" opacity="0.25"/>
  <circle cx="720" cy="400" r="170" fill="#FF8BCB" opacity="0.22"/>

  <!-- App window -->
  <rect x="50" y="40" width="700" height="370" rx="22" fill="#fff" filter="url(#shadow)"/>
  <line x1="50" y1="86" x2="750" y2="86" stroke="#E3E8EF"/>
  <circle cx="78" cy="63" r="6" fill="#FF8BCB"/>
  <circle cx="98" cy="63" r="6" fill="#8AB4F8"/>
  <circle cx="118" cy="63" r="6" fill="#A062FF"/>
  <text x="154" y="68" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="14" font-weight="600" fill="#1F1F1F">Property insights</text>
  <rect x="638" y="53" width="90" height="22" rx="11" fill="#E8F0FE"/>
  <text x="683" y="68" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1A73E8">Data platform</text>

  <!-- Sidebar -->
  <rect x="70" y="110" width="112" height="14" rx="7" fill="url(#aurora)"/>
  <rect x="70" y="142" width="96" height="10" rx="5" fill="#E3E8EF"/>
  <rect x="70" y="168" width="108" height="10" rx="5" fill="#E3E8EF"/>
  <rect x="70" y="194" width="84" height="10" rx="5" fill="#E3E8EF"/>
  <rect x="70" y="220" width="100" height="10" rx="5" fill="#E3E8EF"/>
  <rect x="70" y="344" width="112" height="44" rx="12" fill="#E8F0FE"/>
  <text x="126" y="371" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1A73E8">Connected services</text>

  <!-- Property data map -->
  <rect x="206" y="104" width="304" height="182" rx="16" fill="#EAF0F7"/>
  <path d="M430 104 H494 Q510 104 510 120 V168 C476 164 454 142 430 104" fill="#CFE3F8"/>
  <rect x="222" y="222" width="74" height="48" rx="12" fill="#D7EBDD"/>
  <g fill="none" stroke="#fff" stroke-linecap="round">
    <path d="M212 180 C290 154 374 196 504 170 M300 110 C280 170 342 214 328 280" stroke-width="12"/>
    <path d="M216 244 L502 216 M410 110 L430 280" stroke-width="7"/>
  </g>
  <text x="224" y="132" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="14" font-weight="600" fill="#1F1F1F">Market overview</text>
  <circle cx="274" cy="186" r="21" fill="#1A73E8" opacity="0.15"/>
  <circle cx="274" cy="186" r="10" fill="#1A73E8" stroke="#fff" stroke-width="3"/>
  <circle cx="370" cy="222" r="24" fill="#A062FF" opacity="0.15"/>
  <circle cx="370" cy="222" r="12" fill="#A062FF" stroke="#fff" stroke-width="3"/>
  <circle cx="452" cy="178" r="18" fill="#FF8BCB" opacity="0.25"/>
  <circle cx="452" cy="178" r="9" fill="#FF8BCB" stroke="#fff" stroke-width="3"/>

  <!-- Market trend -->
  <rect x="526" y="104" width="204" height="182" rx="16" fill="#F0F4F9"/>
  <text x="544" y="132" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="14" font-weight="600" fill="#1F1F1F">Market trends</text>
  <text x="544" y="154" font-family="Inter, sans-serif" font-size="11" fill="#5F6368">Property data insights</text>
  <path d="M544 258 H714 M544 224 H714 M544 190 H714" stroke="#E3E8EF"/>
  <path d="M544 252 C568 248 578 218 600 226 S642 204 660 208 S690 174 714 180 L714 266 H544 Z" fill="url(#area)"/>
  <path d="M544 252 C568 248 578 218 600 226 S642 204 660 208 S690 174 714 180" fill="none" stroke="url(#aurora)" stroke-width="3" stroke-linecap="round"/>

  <!-- Service-oriented platform -->
  <rect x="206" y="302" width="524" height="92" rx="16" fill="#F0F4F9"/>
  <text x="224" y="326" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="14" font-weight="600" fill="#1F1F1F">Service-oriented platform</text>
  <path d="M364 359 H394 M534 359 H564" stroke="#8AB4F8" stroke-width="3" stroke-linecap="round"/>
  <rect x="224" y="340" width="140" height="38" rx="10" fill="#fff"/>
  <rect x="394" y="340" width="140" height="38" rx="10" fill="#fff"/>
  <rect x="564" y="340" width="148" height="38" rx="10" fill="#fff"/>
  <circle cx="242" cy="359" r="5" fill="#1A73E8"/>
  <circle cx="412" cy="359" r="5" fill="#A062FF"/>
  <circle cx="582" cy="359" r="5" fill="#FF8BCB"/>
  <g font-family="Inter, sans-serif" font-size="12" fill="#5F6368">
    <text x="256" y="363">Data ingestion</text>
    <text x="426" y="363">Platform APIs</text>
    <text x="596" y="363">Business tools</text>
  </g>
</svg>

