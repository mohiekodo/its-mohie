<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Self-service data annotation and cleaning dashboard illustration">
  <defs>
    <linearGradient id="aurora" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1A73E8"/>
      <stop offset="0.3" stop-color="#8AB4F8"/>
      <stop offset="0.7" stop-color="#A062FF"/>
      <stop offset="1" stop-color="#FF8BCB"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="#F0F4F9"/>
  <circle cx="90" cy="60" r="150" fill="#8AB4F8" opacity="0.25"/>
  <circle cx="720" cy="400" r="170" fill="#FF8BCB" opacity="0.22"/>

  <!-- App window -->
  <rect x="50" y="40" width="700" height="370" rx="22" fill="#fff" filter="url(#shadow)"/>
  <line x1="50" y1="86" x2="750" y2="86" stroke="#E3E8EF"/>
  <circle cx="78" cy="63" r="6" fill="#FF8BCB"/>
  <circle cx="98" cy="63" r="6" fill="#8AB4F8"/>
  <circle cx="118" cy="63" r="6" fill="#A062FF"/>
  <text x="154" y="68" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="14" font-weight="600" fill="#1F1F1F">SelfServe workspace</text>
  <rect x="638" y="53" width="90" height="22" rx="11" fill="#E8F0FE"/>
  <text x="683" y="68" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1A73E8">Annotation</text>

  <!-- Sidebar -->
  <rect x="70" y="110" width="112" height="14" rx="7" fill="url(#aurora)"/>
  <rect x="70" y="142" width="96" height="10" rx="5" fill="#E3E8EF"/>
  <rect x="70" y="168" width="108" height="10" rx="5" fill="#E3E8EF"/>
  <rect x="70" y="194" width="84" height="10" rx="5" fill="#E3E8EF"/>
  <rect x="70" y="220" width="100" height="10" rx="5" fill="#E3E8EF"/>
  <rect x="70" y="344" width="112" height="44" rx="12" fill="#E8F0FE"/>
  <path d="M88 368 L93 373 L102 362" fill="none" stroke="#1A73E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="112" y="371" font-family="Inter, sans-serif" font-size="11" fill="#1A73E8">Quality review</text>

  <!-- Annotation workspace -->
  <rect x="206" y="104" width="304" height="200" rx="16" fill="#F0F4F9"/>
  <text x="224" y="132" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="14" font-weight="600" fill="#1F1F1F">Data annotation</text>
  <rect x="224" y="148" width="268" height="138" rx="12" fill="#fff"/>
  <rect x="240" y="166" width="60" height="22" rx="6" fill="#E8F0FE"/>
  <rect x="312" y="172" width="160" height="8" rx="4" fill="#E3E8EF"/>
  <rect x="240" y="206" width="118" height="22" rx="6" fill="#A062FF" opacity="0.16"/>
  <rect x="370" y="212" width="102" height="8" rx="4" fill="#E3E8EF"/>
  <rect x="240" y="246" width="66" height="22" rx="6" fill="#FF8BCB" opacity="0.24"/>
  <rect x="318" y="252" width="154" height="8" rx="4" fill="#E3E8EF"/>
  <g font-family="Inter, sans-serif" font-size="11" font-weight="500" text-anchor="middle">
    <text x="270" y="181" fill="#1A73E8">Entity</text>
    <text x="299" y="221" fill="#7842CC">Classification</text>
    <text x="273" y="261" fill="#A53E7B">Label</text>
  </g>

  <!-- Batch progress -->
  <rect x="526" y="104" width="204" height="200" rx="16" fill="#F0F4F9"/>
  <text x="544" y="132" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="14" font-weight="600" fill="#1F1F1F">Batch progress</text>
  <circle cx="628" cy="208" r="46" fill="none" stroke="#E3E8EF" stroke-width="10"/>
  <circle cx="628" cy="208" r="46" fill="none" stroke="url(#aurora)" stroke-width="10" stroke-linecap="round" stroke-dasharray="217 289" transform="rotate(-90 628 208)"/>
  <path d="M613 208 L624 219 L644 197" fill="none" stroke="#1A73E8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="628" y="283" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#5F6368">Automated processing</text>

  <!-- Data-cleaning pipeline -->
  <rect x="206" y="320" width="524" height="74" rx="16" fill="#F0F4F9"/>
  <path d="M330 357 H352 M466 357 H488 M602 357 H624" stroke="#8AB4F8" stroke-width="3" stroke-linecap="round"/>
  <rect x="222" y="338" width="108" height="38" rx="10" fill="#fff"/>
  <rect x="352" y="338" width="114" height="38" rx="10" fill="#fff"/>
  <rect x="488" y="338" width="114" height="38" rx="10" fill="#fff"/>
  <rect x="624" y="338" width="90" height="38" rx="10" fill="url(#aurora)"/>
  <g font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#5F6368">
    <text x="276" y="361">Import</text>
    <text x="409" y="361">Clean</text>
    <text x="545" y="361">Annotate</text>
    <text x="669" y="361" fill="#fff">Export</text>
  </g>
</svg>

